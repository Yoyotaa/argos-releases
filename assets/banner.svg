<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 420" width="1280" height="420" role="img" aria-label="Argos — cent yeux, zéro sommeil">
  <defs>
    <radialGradient id="bg" cx="30%" cy="40%" r="90%">
      <stop offset="0" stop-color="#0f1a38"/>
      <stop offset=".55" stop-color="#070b17"/>
      <stop offset="1" stop-color="#05070d"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00e5ff"/>
      <stop offset="1" stop-color="#7c5cff"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#00e5ff"/>
    </linearGradient>
    <radialGradient id="iris" cx="50%" cy="50%" r="50%">
      <stop offset=".38" stop-color="#05070d"/>
      <stop offset=".43" stop-color="#00e5ff"/>
      <stop offset=".76" stop-color="#0a6c8a"/>
      <stop offset="1" stop-color="#7c5cff"/>
    </radialGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#00e5ff" stop-opacity=".35"/>
      <stop offset="1" stop-color="#00e5ff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#78aaff" stroke-opacity=".06"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .spin { transform-origin: 250px 210px; animation: spin 26s linear infinite; }
      .spin-rev { transform-origin: 250px 210px; animation: spin 40s linear infinite reverse; }
      .pulse { transform-origin: 250px 210px; animation: pulse 3.2s ease-in-out infinite; }
      .scan { animation: scan 5s ease-in-out infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }
      @keyframes pulse { 0%,100% { opacity: .9; transform: scale(1); } 50% { opacity: .25; transform: scale(1.18); } }
      @keyframes scan { 0% { transform: translateX(-200px); opacity: 0; } 20% { opacity: 1; } 80% { opacity: 1; } 100% { transform: translateX(720px); opacity: 0; } }
      text { font-family: -apple-system, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; }
      .mono { font-family: "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    </style>
  </defs>

  <rect width="1280" height="420" rx="28" fill="url(#bg)"/>
  <rect width="1280" height="420" rx="28" fill="url(#grid)"/>
  <rect x="1" y="1" width="1278" height="418" rx="27" fill="none" stroke="url(#ring)" stroke-opacity=".35" stroke-width="2"/>

  <!-- L'œil -->
  <circle cx="250" cy="210" r="170" fill="url(#halo)"/>
  <g filter="url(#glow)">
    <g class="spin">
      <circle cx="250" cy="210" r="128" fill="none" stroke="url(#ring)" stroke-width="4" stroke-dasharray="160 26 18 26"/>
    </g>
    <g class="spin-rev">
      <circle cx="250" cy="210" r="106" fill="none" stroke="#00e5ff" stroke-opacity=".4" stroke-width="2" stroke-dasharray="2 9"/>
    </g>
    <circle cx="250" cy="210" r="84" fill="url(#iris)"/>
    <circle class="pulse" cx="250" cy="210" r="84" fill="none" stroke="#00e5ff" stroke-opacity=".6" stroke-width="2"/>
    <circle cx="250" cy="210" r="32" fill="#05070d"/>
    <circle cx="232" cy="192" r="9" fill="#ffffff" opacity=".9"/>
  </g>

  <!-- Texte -->
  <text x="450" y="150" class="mono" font-size="15" letter-spacing="5" fill="#00e5ff">SUITE DE SÉCURITÉ · WINDOWS &amp; MACOS</text>
  <text x="446" y="238" font-size="92" font-weight="700" letter-spacing="26" fill="url(#title)">ARGOS</text>
  <text x="450" y="284" font-size="26" fill="#c4cee6">Cent yeux, zéro sommeil.</text>
  <text x="450" y="326" font-size="17" fill="#7f8cab">Gratuit · sans compte · sans publicité · aucune donnée collectée</text>

  <!-- Balayage -->
  <g class="scan">
    <rect x="450" y="352" width="160" height="2" rx="1" fill="url(#ring)"/>
  </g>
  <rect x="450" y="352" width="720" height="2" rx="1" fill="#78aaff" fill-opacity=".08"/>
</svg>
